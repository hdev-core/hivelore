name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CI: true
  NEXT_PUBLIC_API_URL: http://localhost:3001
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Prisma schema
        run: npm run db:format

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Check fresh PostgreSQL migrations
        run: npm run db:migrate:check:fresh
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - name: Check PostgreSQL migration upgrade path
        run: npm run db:migrate:check:upgrade
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          AUTH_JWT_SECRET: test-only-jwt-secret-with-enough-entropy
          AUTH_REFRESH_SECRET: test-only-refresh-secret-with-enough-entropy

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
